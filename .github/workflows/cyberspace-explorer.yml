name: Cyberspace explorer

# Pull requests run the tests. Every push to main tests it and deploys it to
# icelander.net/v1/apps/cyberspace-explorer (README.md, "Deploying").
# Needs the repository secret CLOUDFLARE_API_TOKEN (Account → Workers Scripts: Edit, and Zone → Workers Routes: Edit
# on icelander.net). The Worker's own secrets are set once, on Cloudflare, and are not touched by a deploy.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cyberspace-explorer-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy the Worker
        run: npx --yes wrangler@4.156.1 deploy --config wrangler.jsonc
      - name: Check that it answers
        run: |
          sleep 5
          curl --fail --silent --show-error --location https://icelander.net/v1/apps/cyberspace-explorer | grep -q "Cyberspace explorer"
          curl --fail --silent --show-error https://icelander.net/v1/apps/cyberspace-explorer/auth/me
