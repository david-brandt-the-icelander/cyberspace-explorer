name: Cyberspace explorer

# Pull requests run the tests. Every push to main tests it and deploys it to
# https://cyberspace-explorer.com (README.md, "Deploying").
# Needs the repository secret CLOUDFLARE_API_TOKEN (Account → Workers Scripts: Edit, and Zone → Workers Routes: Edit
# on cyberspace-explorer.com). The Worker's own secrets are set once, on Cloudflare, and are not touched by a deploy.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cyberspace-explorer-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  # The Rust validators and cyberspace-generator; the parity tests also run the Python validators they replace.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -q --locked -p cyberspace-generator -- validate

  deploy:
    needs: [test, rust]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Both Workers bind a database, a bucket and queues the owner creates once (crawler/README.md, "Setting it up once").
      - name: Check that the crawler's resources exist
        run: |
          if grep -q REPLACE-WITH-D1-DATABASE-ID wrangler.jsonc crawler/wrangler.jsonc; then
            echo "::error::Create the crawler's database, bucket and queues first (crawler/README.md, Setting it up once), and put the database id in wrangler.jsonc and crawler/wrangler.jsonc."
            exit 1
          fi
      - name: Deploy the Worker
        run: npx --yes wrangler@4.156.1 deploy --config wrangler.jsonc
      - name: Deploy the crawler
        run: |
          npm ci --prefix crawler --no-audit --no-fund
          npx --yes wrangler@4.156.1 deploy --config crawler/wrangler.jsonc
      - name: Check that it answers
        run: |
          sleep 5
          curl --fail --silent --show-error --location https://cyberspace-explorer.com/ | grep -q "Cyberspace explorer"
          curl --fail --silent --show-error https://cyberspace-explorer.com/auth/me
          curl --fail --silent --show-error https://cyberspace-explorer.com/crawler | grep -q "cyberspace-crawler"
