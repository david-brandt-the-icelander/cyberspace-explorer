# The Rust half of the repository: the validators for .dev files and the cyberspace-generator tool built on them.
[workspace]
resolver = "2"
members = ["crates/cyberspace-*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/david-brandt-the-icelander/cyberspace-explorer"

[workspace.dependencies]
cyberspace-common = { path = "crates/cyberspace-common" }
cyberspace-diagrams = { path = "crates/cyberspace-diagrams" }
cyberspace-knowledge = { path = "crates/cyberspace-knowledge" }
jsonschema = { version = "0.61.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
regex = "1"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
strip = true
lto = true
